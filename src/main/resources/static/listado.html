<!DOCTYPE html>
<html>
    <head>
        <title>head-Title</title>
    </head>
    <body>
        hola
        <article >
            <header>heady</header>
            <img src="soon.png"></article>
            <footer>footi</footer>
            
            <script>
                function recorrer(nodo, nivel = 0) {
                    console.log(
                        " ".repeat(nivel * 2) +
                        nodo.nodeName +
                        ` (tipo ${nodo.nodeType})`
                    );
                    
                    for (const hijo of nodo.childNodes) {
                        recorrer(hijo, nivel + 1);
                    }
                }
            </script>
    </body>
</html>
